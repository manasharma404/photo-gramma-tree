# Road segment measurement settings (roads/segments.py). Lead-owned.
# Every threshold is a PLACEHOLDER until checked against field data.
segment_max_m: 50            # brief section 9
station_step_m: 1.0          # brief section 9
across_step_m: 0.10          # matches our DSM resolution (0.10 m)
surface_percentile: 10       # PLACEHOLDER: low percentile of each cross-section = road surface estimate
obstruction_min_m: 0.30      # PLACEHOLDER: height above fitted surface that counts as an obstruction
canopy_min_m: 3.0            # PLACEHOLDER: DSM - DTM above this = vegetation canopy -> "not visible", not "blocked"
default_width_by_class_m:    # PLACEHOLDER: used only when OSM has no width tag
  primary: 7.0
  secondary: 6.0
  tertiary: 5.5
  unclassified: 5.0
  residential: 5.0
  service: 4.0
  track: 3.0
  path: 1.5
  footway: 1.5
  other: 3.0
