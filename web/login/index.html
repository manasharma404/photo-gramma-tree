<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F6EF" />
  <title>Project Typhon · Sign in</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
</head>
<body class="login">
  <main class="login__card">
    <span class="logo" data-logo></span>
    <h1>Sign in</h1>
    <p class="login__lead">Enter the code you were given: the operator code, the judges' code, or your team PIN.</p>
    <form id="login-form" autocomplete="off">
      <label for="code">Access code</label>
      <input id="code" name="code" type="password" required maxlength="64" autofocus />
      <button type="submit" id="go">Sign in</button>
      <p class="login__msg" id="msg" role="alert"></p>
    </form>
    <p class="login__note">One laptop, no internet: this page and the map are served by the Typhon laptop on this network.</p>
  </main>
  <script type="module" src="../src/login.js"></script>
</body>
</html>
